name: Modify Normal_bl

on:
  workflow_dispatch:
    inputs:
      sheet_name:
        description: "Target sheet"
        required: true
        type: string

permissions:
  actions: write
  contents: read

jobs:
  modify-normal:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install selenium gspread google-auth

      - name: Build Job List
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          TARGET_SHEET: ${{ github.event.inputs.sheet_name }}
        run: |
          python modify_normal_bl_ver/factory_host.py > jobs.json

          echo "===== jobs.json ====="
          cat jobs.json
          
      - name: Dispatch Workers
        env:
          GH_TOKEN: ${{ github.token }}
          SHEET_NAME: ${{ github.event.inputs.sheet_name }}
        run: |
          python - <<'PY'
          import json
          import os
          import subprocess
      
          with open("jobs.json", "r", encoding="utf-8") as f:
              jobs = json.load(f)["include"]
      
          for job in jobs:
              row = str(job["row"])
      
              print(f"Dispatch row {row}")
      
              subprocess.run([
                  "curl",
                  "-L",
                  "-X", "POST",
                  "-H", "Accept: application/vnd.github+json",
                  "-H", f"Authorization: Bearer {os.environ['GH_TOKEN']}",
                  f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/actions/workflows/worker_normal_bl.yml/dispatches",
                  "-d",
                  json.dumps({
                      "ref": os.environ["GITHUB_REF_NAME"],
                      "inputs": {
                          "row": row,
                          "sheet_name": os.environ["SHEET_NAME"]
                      }
                  })
              ], check=True)
      
          PY
