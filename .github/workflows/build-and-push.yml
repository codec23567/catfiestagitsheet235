name: Build and Push Images

on:
  push:
    branches: [main]
    paths:
      - "Dockerfile.crawler"
      - "Dockerfile.selenium"
      - "nickdate/**"
      - "image/**"
      - "modify_html_ver/**"
      - "modify_normal_ver/**"
      - "modify_normal_bl_ver/**"
      - "requirements.txt"

jobs:
  build-crawler:
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push crawler image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.crawler
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/catfiesta-crawler:latest

  build-selenium:
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push selenium image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.selenium
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/catfiesta-selenium:latest
