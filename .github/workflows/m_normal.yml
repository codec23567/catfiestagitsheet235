name: Modify Normal

on:
  workflow_dispatch:
    inputs:
      sheet_name:
        description: "Target sheet"
        required: true
        type: string

jobs:
  modify-normal:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install selenium gspread google-auth

      - name: Run
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          TARGET_SHEET: ${{ github.event.inputs.sheet_name }}
          CAT_ID: ${{ secrets.CAT_ID }}
          CAT_PW: ${{ secrets.CAT_PW }}
        run: python modify_normal_ver/read_host_normal.py
